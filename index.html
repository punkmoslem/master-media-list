<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Master Media List — R&amp;R Communications</title>
<link rel="icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --navy:#2c3e50;
    --navy-dark:#1c2a38;
    --teal:#17a68d;
    --teal-dark:#128a75;
    --bg:#f4f7f7;
    --card:#ffffff;
    --border:#e2e8e7;
    --text:#22303a;
    --muted:#66798591;
    --muted-solid:#63767f;
    --shadow: 0 4px 18px rgba(28,42,56,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Lato', 'Helvetica Neue', Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(23,166,141,0.08), transparent 40%),
      radial-gradient(circle at 100% 20%, rgba(44,62,80,0.06), transparent 45%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:22px 32px;
    background:linear-gradient(120deg, var(--navy-dark), var(--navy));
    box-shadow: var(--shadow);
    position:sticky;
    top:0;
    z-index:10;
  }
  header img{
    height:42px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  }
  header .title{
    color:#fff;
  }
  header .title h1{
    margin:0;
    font-size:1.25rem;
    font-weight:700;
    letter-spacing:0.02em;
  }
  header .title p{
    margin:2px 0 0;
    font-size:0.78rem;
    color:#b9c6cf;
    letter-spacing:0.03em;
  }
  header .status{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:0.78rem;
    color:#cfe0dc;
  }
  header .dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--teal);
    box-shadow:0 0 0 3px rgba(23,166,141,0.25);
  }
  header button.refresh{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    border-radius:8px;
    padding:6px 12px;
    font-size:0.78rem;
    cursor:pointer;
    transition:background .15s;
  }
  header button.refresh:hover{ background:rgba(255,255,255,0.18); }

  .nav-tabs{
    display:flex;
    gap:8px;
    max-width:920px;
    margin:0 auto;
    padding:16px 20px 0;
  }
  .nav-tabs a{
    padding:8px 18px;
    border-radius:999px;
    font-size:0.85rem;
    font-weight:600;
    text-decoration:none;
    color:var(--muted-solid);
    background:var(--card);
    border:1px solid var(--border);
    transition:all .15s;
  }
  .nav-tabs a:hover{ color:var(--teal-dark); border-color:var(--teal); }
  .nav-tabs a.active{
    background:linear-gradient(120deg, var(--teal), var(--teal-dark));
    color:#fff;
    border-color:transparent;
  }

  main{
    max-width:920px;
    margin:0 auto;
    padding:24px 20px 80px;
  }
  .search-wrap{
    position:relative;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:6px 6px 6px 18px;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-box:focus-within{
    border-color:var(--teal);
    box-shadow:0 0 0 4px rgba(23,166,141,0.12), var(--shadow);
  }
  .search-box svg{ flex-shrink:0; color:var(--muted-solid); }
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    font-size:1.05rem;
    padding:14px 10px;
    background:transparent;
    color:var(--text);
  }
  .search-box input::placeholder{ color:#9aacb2; }
  .search-box button{
    background:linear-gradient(120deg, var(--teal), var(--teal-dark));
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px 22px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:filter .15s, transform .1s;
  }
  .search-box button:hover{ filter:brightness(1.08); }
  .search-box button:active{ transform:scale(0.98); }

  .suggestions{
    position:absolute;
    top:calc(100% + 8px);
    left:0; right:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
    z-index:20;
    max-height:340px;
    overflow-y:auto;
    display:none;
  }
  .suggestions.open{ display:block; }
  .suggestion-item{
    padding:12px 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--border);
  }
  .suggestion-item:last-child{ border-bottom:none; }
  .suggestion-item:hover, .suggestion-item.active{
    background: rgba(23,166,141,0.08);
  }
  .suggestion-item .name{ font-weight:600; }
  .suggestion-item .name mark{
    background:rgba(23,166,141,0.25);
    color:inherit;
    border-radius:3px;
  }
  .suggestion-item .tier{
    font-size:0.72rem;
    padding:3px 9px;
    border-radius:999px;
    background:var(--navy);
    color:#fff;
    white-space:nowrap;
  }

  .hint{
    text-align:center;
    color:var(--muted-solid);
    font-size:0.85rem;
    margin-top:14px;
  }

  #results{
    margin-top:34px;
    transition: opacity .28s cubic-bezier(.4,0,.2,1), transform .28s cubic-bezier(.4,0,.2,1), filter .28s cubic-bezier(.4,0,.2,1);
    transform-origin: top center;
  }
  #results.morph-out{
    opacity:0;
    transform: translateY(4px) scale(0.99);
    filter: blur(2px);
  }
  .empty-state{
    text-align:center;
    color:var(--muted-solid);
    padding:60px 20px;
  }
  .empty-state h2{ color:var(--navy); font-size:1.1rem; margin-bottom:6px;}
  .empty-state svg{ opacity:0.35; margin-bottom:14px; }

  .card{
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    overflow:hidden;
    animation: fadeIn .35s cubic-bezier(.16,1,.3,1);
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .card-header{
    background:linear-gradient(120deg, var(--navy-dark), var(--navy));
    color:#fff;
    padding:22px 26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .card-header h2{
    margin:0 0 4px;
    font-size:1.35rem;
  }
  .card-header .no{
    font-size:0.75rem;
    color:#a9bac2;
    letter-spacing:.05em;
    text-transform:uppercase;
  }
  .badge-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .badge{
    padding:6px 14px;
    border-radius:999px;
    font-size:0.78rem;
    font-weight:600;
  }
  .badge.tier{ background:var(--teal); color:#fff; }
  .badge.desk{ background:rgba(255,255,255,0.14); color:#fff; border:1px solid rgba(255,255,255,0.35); }

  .section{
    padding:22px 26px;
    border-top:1px solid var(--border);
  }
  .section h3{
    margin:0 0 14px;
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--teal-dark);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section h3::before{
    content:"";
    width:4px;height:14px;
    background:var(--teal);
    border-radius:2px;
    display:inline-block;
  }
  .section h3 .sub{
    text-transform:none;
    letter-spacing:normal;
    color:var(--muted-solid);
    font-weight:500;
    font-size:0.78rem;
  }
  .subhead{
    font-size:0.72rem;
    color:var(--muted-solid);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin:18px 0 8px;
  }
  .profile-box{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    max-height:260px;
    overflow-y:auto;
    font-size:0.95rem;
    line-height:1.6;
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .profile-box a{ color:var(--teal-dark); }
  .profile-box.empty{ color:var(--muted-solid); font-style:italic; }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:14px;
  }
  .stat{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
  }
  .stat .label{ font-size:0.72rem; color:var(--muted-solid); text-transform:uppercase; letter-spacing:.04em;}
  .stat .value{ font-size:1.15rem; font-weight:700; color:var(--teal-dark); margin-top:4px; word-break:break-word;}
  .stat .value a{ color:var(--teal-dark); text-decoration:none; }
  .stat .value a:hover{ text-decoration:underline; }
  .stat .updated{ font-size:0.72rem; color:var(--muted-solid); margin-top:4px; }

  .social-rows{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .social-row{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 18px;
    display:grid;
    grid-template-columns:1.4fr 1fr;
    align-items:center;
    gap:14px;
    background:var(--bg);
  }
  .social-row.empty{ opacity:0.45; }
  .social-row-handle{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .social-icon{
    width:40px; height:40px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    flex-shrink:0;
    font-size:1rem;
    overflow:hidden;
  }
  .social-icon img{ width:100%; height:100%; object-fit:contain; display:block; }
  .social-icon svg{ width:22px; height:22px; }
  .social-icon svg.icon-lg{ width:34px; height:34px; }
  .social-icon img.icon-lg{ transform:scale(1.8); }
  .social-meta{ min-width:0; }
  .social-meta .platform{ font-size:0.72rem; color:var(--muted-solid); text-transform:uppercase; letter-spacing:.04em;}
  .social-meta .handle{ font-weight:700; font-size:0.92rem; }
  .social-meta .handle a{ color:var(--navy); text-decoration:none; }
  .social-meta .handle a:hover{ color:var(--teal-dark); text-decoration:underline; }
  .social-stat .label{ font-size:0.68rem; color:var(--muted-solid); text-transform:uppercase; letter-spacing:.04em; }
  .social-stat .value{ font-size:0.9rem; font-weight:700; color:var(--teal-dark); margin-top:2px; }
  .social-stat .updated{ font-size:0.7rem; color:var(--muted-solid); margin-top:2px; }
  @media (max-width:640px){
    .social-row{ grid-template-columns:1fr; gap:8px; }
  }

  .journalist-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .journalist{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    border:1px solid var(--border);
    background:var(--bg);
    border-radius:12px;
    padding:14px 16px;
  }
  .journalist .jname{
    font-weight:700;
    color:var(--navy);
    grid-column:1/-1;
    font-size:1rem;
  }
  .journalist .jfield .label{ font-size:0.68rem; text-transform:uppercase; color:var(--muted-solid); letter-spacing:.04em;}
  .journalist .jfield .val{ font-size:0.88rem; color:var(--text); word-break:break-word;}
  .journalist .jfield .val a{ color:var(--teal-dark); text-decoration:none; }
  .journalist .jfield .val a:hover{ text-decoration:underline; }

  footer{
    text-align:center;
    color:var(--muted-solid);
    font-size:0.75rem;
    padding:30px 20px 40px;
  }

  @media (max-width:600px){
    header{padding:16px 18px;}
    .search-box{flex-wrap:nowrap;}
    .search-box button{padding:10px 16px; font-size:0.85rem;}
    .card-header{padding:18px;}
    .section{padding:18px;}
    .journalist{grid-template-columns:1fr;}
  }

  /* ================= Depth / dimensional layer ================= */
  :root{
    --shadow: 0 1px 2px rgba(28,42,56,.04), 0 6px 14px rgba(28,42,56,.07), 0 18px 36px rgba(28,42,56,.06);
    --shadow-lg: 0 2px 4px rgba(28,42,56,.05), 0 14px 28px rgba(28,42,56,.10), 0 32px 60px rgba(28,42,56,.08);
    --shadow-xl: 0 4px 8px rgba(28,42,56,.05), 0 22px 44px rgba(28,42,56,.13), 0 48px 88px rgba(28,42,56,.10);
    --hl: inset 0 1px 0 rgba(255,255,255,.95);
    --hl-soft: inset 0 1px 0 rgba(255,255,255,.75);
    --surface: linear-gradient(163deg,#fdfefe 0%,#fafcfc 50%,#f6faf9 100%);
    --panel: linear-gradient(163deg,#ffffff 0%,#fdfefe 100%);
    --ease-soft: cubic-bezier(.16,1,.3,1);
  }

  body{
    background:
      radial-gradient(1100px 620px at 10% -10%, rgba(23,166,141,.13), transparent 60%),
      radial-gradient(950px 520px at 106% 2%, rgba(44,62,80,.10), transparent 58%),
      radial-gradient(760px 460px at 50% 118%, rgba(23,166,141,.07), transparent 62%),
      var(--bg);
    background-attachment: fixed;
  }

  /* --- header --- */
  header{
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      0 2px 8px rgba(16,26,36,.18),
      0 12px 32px rgba(16,26,36,.22);
  }
  header img{ filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
  header button.refresh{
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.22),
      0 2px 6px rgba(0,0,0,.22);
    transition: transform .18s var(--ease-soft), box-shadow .18s var(--ease-soft), background .18s;
  }
  header button.refresh:hover{
    transform:translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 5px 14px rgba(0,0,0,.28);
  }
  header button.refresh:active{ transform:translateY(0) scale(.97); }
  header .dot{
    box-shadow:0 0 0 3px rgba(23,166,141,.22), 0 0 12px rgba(23,166,141,.7);
  }

  /* --- nav pills --- */
  .nav-tabs a{
    background:var(--panel);
    box-shadow: var(--shadow), var(--hl);
    transition: transform .22s var(--ease-soft), box-shadow .22s var(--ease-soft), color .2s, border-color .2s;
  }
  .nav-tabs a:hover{
    transform:translateY(-2px);
    box-shadow: var(--shadow-lg), var(--hl);
  }
  .nav-tabs a.active{
    background:linear-gradient(170deg,#1cb69b 0%, var(--teal) 42%, var(--teal-dark) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.32),
      inset 0 -1px 0 rgba(0,0,0,.10),
      0 3px 8px rgba(18,138,117,.30),
      0 10px 24px rgba(18,138,117,.24);
  }
  .nav-tabs a.active:hover{
    transform:translateY(-2px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.32),
      0 6px 14px rgba(18,138,117,.34),
      0 16px 34px rgba(18,138,117,.28);
  }

  /* --- search --- */
  .search-box{
    background:var(--panel);
    border-radius:18px;
    box-shadow: var(--shadow-lg), var(--hl);
    transition: transform .28s var(--ease-soft), box-shadow .28s var(--ease-soft), border-color .2s;
  }
  .search-box:focus-within{
    transform:translateY(-2px);
    box-shadow:
      0 0 0 4px rgba(23,166,141,.13),
      var(--shadow-xl),
      var(--hl);
  }
  .search-box button{
    background:linear-gradient(170deg,#1cb69b 0%, var(--teal) 42%, var(--teal-dark) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.34),
      inset 0 -1px 0 rgba(0,0,0,.12),
      0 3px 8px rgba(18,138,117,.32),
      0 8px 20px rgba(18,138,117,.26);
    transition: transform .18s var(--ease-soft), box-shadow .18s var(--ease-soft), filter .18s;
  }
  .search-box button:hover{
    transform:translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.34),
      0 6px 14px rgba(18,138,117,.36),
      0 14px 30px rgba(18,138,117,.30);
  }
  .search-box button:active{ transform:translateY(0) scale(.97); }

  .suggestions{
    border-radius:16px;
    background:var(--panel);
    box-shadow: var(--shadow-xl), var(--hl);
  }
  .suggestion-item{ transition: background .18s, padding-left .18s var(--ease-soft); }
  .suggestion-item:hover, .suggestion-item.active{ padding-left:22px; }
  .suggestion-item .tier{
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 2px 5px rgba(28,42,56,.22);
  }

  /* --- main card --- */
  .card{
    background:var(--surface);
    border:1px solid rgba(226,232,231,.85);
    border-radius:22px;
    box-shadow: var(--shadow-xl), var(--hl);
  }
  .card-header{
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      0 6px 18px rgba(16,26,36,.16);
  }
  .badge.tier{
    background:linear-gradient(170deg,#1cb69b 0%, var(--teal) 45%, var(--teal-dark) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.30),
      0 3px 8px rgba(18,138,117,.34);
  }
  .badge.desk{
    background:linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.10));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.24), 0 2px 6px rgba(0,0,0,.18);
  }
  .section h3::before{
    background:linear-gradient(180deg,#22c4a7, var(--teal-dark));
    box-shadow:0 1px 4px rgba(23,166,141,.55);
  }

  /* --- inner raised panels --- */
  .stat,
  .profile-box,
  .social-row,
  .journalist{
    background:var(--panel);
    border:1px solid rgba(226,232,231,.9);
    border-radius:14px;
    box-shadow:
      0 1px 2px rgba(28,42,56,.05),
      0 4px 10px rgba(28,42,56,.06),
      var(--hl-soft);
  }
  .social-row,
  .journalist,
  .stat{
    transition: transform .26s var(--ease-soft), box-shadow .26s var(--ease-soft);
  }
  .social-row:hover,
  .journalist:hover,
  .stat:hover{
    transform:translateY(-2px);
    box-shadow:
      0 2px 4px rgba(28,42,56,.06),
      0 10px 22px rgba(28,42,56,.10),
      0 20px 40px rgba(28,42,56,.07),
      var(--hl-soft);
  }
  .social-row.empty:hover{ transform:none; }

  .social-icon{
    border-radius:12px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -1px 0 rgba(0,0,0,.14),
      0 3px 8px rgba(28,42,56,.22),
      0 6px 16px rgba(28,42,56,.14);
    transition: transform .26s var(--ease-soft), box-shadow .26s var(--ease-soft);
  }
  .social-row:hover .social-icon{
    transform:translateY(-1px) scale(1.04);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.3),
      0 5px 12px rgba(28,42,56,.26),
      0 10px 24px rgba(28,42,56,.18);
  }

  /* --- compare: segmented toggle --- */
  .seg{
    background:var(--panel);
    box-shadow: var(--shadow-lg), var(--hl);
  }
  .seg .thumb{
    background:linear-gradient(170deg,#1cb69b 0%, var(--teal) 42%, var(--teal-dark) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.34),
      inset 0 -1px 0 rgba(0,0,0,.12),
      0 3px 8px rgba(18,138,117,.34),
      0 8px 20px rgba(18,138,117,.26);
  }

  /* --- compare: chips --- */
  .chip{
    background:var(--panel);
    box-shadow:
      0 1px 2px rgba(28,42,56,.05),
      0 4px 10px rgba(28,42,56,.07),
      var(--hl-soft);
    transition: transform .22s var(--ease-soft), box-shadow .22s var(--ease-soft);
  }
  .chip:hover{
    transform:translateY(-2px);
    box-shadow: var(--shadow-lg), var(--hl-soft);
  }
  .btn-clear{
    background:var(--panel);
    box-shadow: 0 1px 2px rgba(28,42,56,.05), 0 3px 8px rgba(28,42,56,.06), var(--hl-soft);
    transition: transform .2s var(--ease-soft), box-shadow .2s var(--ease-soft), color .2s, border-color .2s;
  }
  .btn-clear:hover{ transform:translateY(-1px); box-shadow: var(--shadow), var(--hl-soft); }
  .btn-clear:active{ transform:translateY(0) scale(.97); }

  /* --- compare: platform tabs --- */
  .platform-tabs button{
    background:var(--panel);
    box-shadow:
      0 1px 2px rgba(28,42,56,.05),
      0 3px 8px rgba(28,42,56,.06),
      var(--hl-soft);
  }
  .platform-tabs button:hover{
    transform:translateY(-2px);
    box-shadow: var(--shadow-lg), var(--hl-soft);
  }
  .platform-tabs button.active{
    background:linear-gradient(170deg,#3a5063 0%, var(--navy) 45%, var(--navy-dark) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.16),
      inset 0 -1px 0 rgba(0,0,0,.18),
      0 3px 8px rgba(28,42,56,.28),
      0 10px 24px rgba(28,42,56,.20);
  }
  .platform-tabs .pico{
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.26),
      0 2px 5px rgba(28,42,56,.28);
  }

  /* --- compare: table --- */
  .table-wrap{
    background:var(--surface);
    border:1px solid rgba(226,232,231,.85);
    border-radius:20px;
    box-shadow: var(--shadow-xl), var(--hl);
  }
  thead th{
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      0 4px 12px rgba(16,26,36,.14);
  }
  tbody tr{ transition: background .2s, box-shadow .2s; }
  tbody tr:hover{
    box-shadow: inset 3px 0 0 var(--teal);
  }
  td.num.best::after{
    background:linear-gradient(170deg,#1cb69b, var(--teal-dark));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 5px rgba(18,138,117,.4);
  }

  /* --- empty state --- */
  .empty-state svg{ filter: drop-shadow(0 6px 14px rgba(28,42,56,.14)); }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important;
      transition-duration:.01ms !important;
    }
  }


  /* ================= Header motion + footer mark ================= */
  header{
    position:sticky;
    overflow:hidden;
    background:linear-gradient(120deg, var(--navy-dark) 0%, var(--navy) 35%, #24384c 60%, var(--navy) 80%, var(--navy-dark) 100%);
    background-size:300% 300%;
    animation: headerFlow 24s ease-in-out infinite;
  }
  @keyframes headerFlow{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  /* drifting teal aurora behind the header content */
  header::before{
    content:"";
    position:absolute;
    inset:-70% -25%;
    background:
      radial-gradient(closest-side, rgba(23,166,141,.34), transparent 72%),
      radial-gradient(closest-side, rgba(23,166,141,.20), transparent 72%);
    background-repeat:no-repeat;
    background-size:46% 190%, 34% 165%;
    background-position:2% 40%, 68% 62%;
    filter:blur(26px);
    animation: headerAurora 19s ease-in-out infinite alternate;
    pointer-events:none;
    z-index:0;
  }
  @keyframes headerAurora{
    0%{   background-position:0% 42%, 66% 60%; opacity:.85; }
    50%{  background-position:42% 56%, 34% 34%; opacity:1; }
    100%{ background-position:82% 46%, 8% 66%; opacity:.9; }
  }
  /* travelling teal sheen along the bottom edge */
  header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:2px;
    background:linear-gradient(90deg, transparent 0%, rgba(23,166,141,.15) 20%, var(--teal) 45%, #3fe0c0 52%, var(--teal) 60%, rgba(23,166,141,.15) 80%, transparent 100%);
    background-size:220% 100%;
    animation: headerSheen 7s linear infinite;
    pointer-events:none;
    z-index:1;
  }
  @keyframes headerSheen{
    from{ background-position:220% 0; }
    to{   background-position:-220% 0; }
  }
  header > *{ position:relative; z-index:2; }

  /* staggered entrance */
  header img       { animation: hdrRise .75s var(--ease-soft) both; }
  header .title h1 { animation: hdrRise .75s .07s var(--ease-soft) both; }
  header .title p  { animation: hdrRise .75s .14s var(--ease-soft) both; }
  header .status   { animation: hdrRise .75s .21s var(--ease-soft) both; }
  @keyframes hdrRise{
    from{ opacity:0; transform:translateY(-10px); }
    to{   opacity:1; transform:translateY(0); }
  }
  header img{ transition: transform .45s var(--ease-soft), filter .45s var(--ease-soft); }
  header:hover img{ transform:scale(1.05); filter: drop-shadow(0 4px 12px rgba(0,0,0,.45)); }

  /* breathing status dot */
  header .dot{ animation: dotPulse 2.6s ease-in-out infinite; }
  @keyframes dotPulse{
    0%,100%{ box-shadow:0 0 0 3px rgba(23,166,141,.22), 0 0 12px rgba(23,166,141,.65); }
    50%{     box-shadow:0 0 0 6px rgba(23,166,141,.10), 0 0 22px rgba(23,166,141,1); }
  }

  /* --- footer mark --- */
  footer{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:38px 20px 52px;
  }
  .footer-logo{
    height:30px;
    width:auto;
    opacity:.45;
    transition: opacity .35s var(--ease-soft), transform .35s var(--ease-soft), filter .35s var(--ease-soft);
  }
  .footer-logo:hover{
    opacity:1;
    transform:translateY(-2px);
    filter: drop-shadow(0 6px 14px rgba(28,42,56,.22));
  }

</style>
</head>
<body>

<header>
  <img src="logo.png" alt="R&R Communications logo" />
  <div class="title">
    <h1>Master Media List</h1>
    <p>Search media &amp; journalist database</p>
  </div>
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Loading…</span>
    <button class="refresh" id="refreshBtn">Refresh</button>
  </div>
</header>

<div class="nav-tabs">
  <a href="index.html" class="active">Master Media List</a>
  <a href="kol.html">Master KOL List</a>
  <a href="compare.html">Compare</a>
</div>

<main>
  <div class="search-wrap">
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Search media outlet or journalist name…" autocomplete="off" />
      <button id="searchBtn">Search</button>
    </div>
    <div class="suggestions" id="suggestions"></div>
  </div>
  <p class="hint">Type at least 2 characters, pick a suggestion or press Enter to search.</p>

  <div id="results">
    <div class="empty-state" id="emptyState">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5"/></svg>
      <h2>No media selected yet</h2>
      <p>Search for a media outlet or journalist above to see full details.</p>
    </div>
  </div>
</main>

<footer><img class="footer-logo" src="logo.png" alt="R&amp;R Communications" /></footer>

<script>
const SHEET_ID = "1F59-rVz9vJb59obojWpE9bWo91jefGu-nTrpzK6309k";
const GID = "0";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const refreshBtn = document.getElementById('refreshBtn');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const suggestionsEl = document.getElementById('suggestions');
const resultsEl = document.getElementById('results');

let records = [];
let activeIndex = -1;

const SOCIAL_ICONS = {
  YT: {
    label:"YouTube", color:"#ff0000",
    icon:`<svg class="icon-lg" viewBox="0 0 24 24" fill="#fff"><path d="M8.5 8.64v6.72L15.5 12 8.5 8.64z"/><path d="M0 0h24v24H0z" fill="none"/></svg>`
  },
  IG: { label:"Instagram", color:"#d6249f", img:"icon-instagram.png", imgClass:"icon-lg" },
  TikTok: { label:"TikTok", color:"#000000", img:"icon-tiktok.png" },
  X: {
    label:"X", color:"#000000",
    icon:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M18.9 2H22l-7.6 8.7L23 22h-6.9l-5.4-6.6L4.5 22H1.4l8.1-9.3L1 2h7.1l4.9 6.1L18.9 2zm-1.2 18h1.9L7.4 4H5.4l12.3 16z"/></svg>`
  },
  Threads: {
    label:"Threads", color:"#000000",
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M12 3c-4.4 0-7 2.7-7 7v4c0 4.3 2.6 7 7 7s7-2.7 7-7"/><path d="M12 8.3c2.6 0 4 1.2 4 3.1 0 2-1.6 3.1-3.7 3.1-1.8 0-2.8-.8-2.8-1.9 0-1.3 1.4-2 3.4-2 1.7 0 3 .4 3.7 1"/></svg>`
  }
};

function socialUrl(key, user){
  if(!user || user === "-") return null;
  const handle = user.replace(/^@/, "").trim();
  if(!handle) return null;
  switch(key){
    case "YT": return `https://www.youtube.com/${user.startsWith("@") ? user : "@"+handle}`;
    case "IG": return `https://www.instagram.com/${handle}`;
    case "TikTok": return `https://www.tiktok.com/@${handle}`;
    case "X": return `https://x.com/${handle}`;
    case "Threads": return `https://www.threads.net/@${handle}`;
    default: return null;
  }
}

function norm(s){ return (s||"").toString().trim(); }
function cleanCell(s){ return norm(s).replace(/\s+/g," ").trim(); }

function parseCSV(text){
  const parsed = Papa.parse(text, { skipEmptyLines: true });
  const rows = parsed.data;
  const header = rows[0].map(h => cleanCell(h));
  const idx = {};
  header.forEach((h,i)=>{ idx[h]=i; });

  // detect repeating journalist blocks: Nama Jurnalis, Email, Phone, Desk (may repeat with suffixes)
  const journalistStartCols = [];
  header.forEach((h,i)=>{
    if(/^Nama Jurnalis/i.test(h)) journalistStartCols.push(i);
  });

  const data = [];
  for(let r=1; r<rows.length; r++){
    const row = rows[r];
    if(!row || row.every(c => cleanCell(c)==="")) continue;
    const get = (name) => cleanCell(row[idx[name]]);

    const journalists = [];
    journalistStartCols.forEach(startCol => {
      const nameV = cleanCell(row[startCol]);
      const email = cleanCell(row[startCol+1]);
      const phone = cleanCell(row[startCol+2]);
      const desk = cleanCell(row[startCol+3]);
      if(nameV || email || phone || desk){
        journalists.push({ name: nameV || "—", email, phone, desk });
      }
    });

    const rec = {
      no: get("No"),
      media: get("Media"),
      tier: get("Tier"),
      readership: header.find(h=>/^Readerships/i.test(h)) ? cleanCell(row[idx[header.find(h=>/^Readerships/i.test(h))]]) : "",
      readershipUpdated: header.find(h=>/^Hypestat/i.test(h)) ? cleanCell(row[idx[header.find(h=>/^Hypestat/i.test(h))]]) : "",
      socialUpdated: get("YT Last Updated"),
      profile: get("Profil"),
      social: {
        YT: { user: get("YT Username"), followers: get("YT Subscribers"), updated: get("YT Last Updated") },
        IG: { user: get("IG Username"), followers: get("IG Followers"), updated: get("IG Last Updated") },
        TikTok: { user: get("TikTok Username"), followers: get("TikTok Followers"), updated: get("TikTok Last Updated") },
        X: { user: get("X Username"), followers: get("X Followers"), updated: get("X Last Updated") },
        Threads: { user: get("Threads Username"), followers: get("Threads Followers"), updated: get("Threads Last Updated") }
      },
      journalists
    };
    if(rec.media) data.push(rec);
  }
  return data;
}

async function loadData(showStatus=true){
  if(showStatus){
    statusText.textContent = "Loading…";
    statusDot.style.background = "#f4c542";
  }
  try{
    const res = await fetch(CSV_URL + "&cachebust=" + Date.now());
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    records = parseCSV(text);
    statusText.textContent = `${records.length} media loaded`;
    statusDot.style.background = "var(--teal)";
  }catch(err){
    console.error(err);
    statusText.textContent = "Failed to load — retry";
    statusDot.style.background = "#e35555";
  }
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function highlight(text, query){
  if(!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + "<mark>" + escapeHtml(text.slice(idx, idx+query.length)) + "</mark>" + escapeHtml(text.slice(idx+query.length));
}

function matchRecord(rec, q){
  const query = q.toLowerCase();
  if(rec.media.toLowerCase().includes(query)) return true;
  return rec.journalists.some(j => j.name.toLowerCase().includes(query));
}

function renderSuggestions(query){
  if(query.length < 2){
    suggestionsEl.classList.remove('open');
    suggestionsEl.innerHTML = "";
    return;
  }
  const matches = records.filter(r => matchRecord(r, query)).slice(0, 8);
  if(matches.length === 0){
    suggestionsEl.innerHTML = `<div class="suggestion-item" style="cursor:default;color:var(--muted-solid)">No matches found</div>`;
    suggestionsEl.classList.add('open');
    return;
  }
  suggestionsEl.innerHTML = matches.map((r,i) => `
    <div class="suggestion-item" data-index="${i}" data-media="${escapeHtml(r.media)}">
      <span class="name">${highlight(r.media, query)}</span>
      <span class="tier">${escapeHtml(r.tier || "—")}</span>
    </div>
  `).join("");
  suggestionsEl.classList.add('open');
  activeIndex = -1;
  [...suggestionsEl.querySelectorAll('.suggestion-item')].forEach(el => {
    el.addEventListener('click', () => {
      const media = el.getAttribute('data-media');
      searchInput.value = media;
      suggestionsEl.classList.remove('open');
      doSearch(media);
    });
  });
}

function doSearch(q){
  const query = norm(q || searchInput.value);
  if(!query) return;
  const exact = records.find(r => r.media.toLowerCase() === query.toLowerCase());
  const rec = exact || records.find(r => matchRecord(r, query));
  suggestionsEl.classList.remove('open');
  if(!rec){
    swapResults(`<div class="empty-state"><h2>No results for "${escapeHtml(query)}"</h2><p>Try a different media name or journalist name.</p></div>`);
    return;
  }
  renderResult(rec);
}

let swapToken = 0;
function swapResults(html){
  const token = ++swapToken;
  resultsEl.classList.add('morph-out');
  setTimeout(() => {
    if(token !== swapToken) return;
    resultsEl.innerHTML = html;
    requestAnimationFrame(() => {
      if(token !== swapToken) return;
      resultsEl.classList.remove('morph-out');
    });
  }, 160);
}

function socialCardHTML(key, data){
  const meta = SOCIAL_ICONS[key];
  const has = data.user && data.user !== "-" && data.user !== "";
  const url = has ? socialUrl(key, data.user) : null;
  const iconInner = meta.img ? `<img class="${meta.imgClass || ""}" src="${meta.img}" alt="${meta.label}" />` : meta.icon;
  const handleInner = has
    ? (url ? `<a href="${url}" target="_blank" rel="noopener">${escapeHtml(data.user)}</a>` : escapeHtml(data.user))
    : "Not available";
  return `
    <div class="social-row ${has ? "" : "empty"}">
      <div class="social-row-handle">
        <div class="social-icon" style="background:${meta.color}">${iconInner}</div>
        <div class="social-meta">
          <div class="platform">${meta.label}</div>
          <div class="handle">${handleInner}</div>
        </div>
      </div>
      <div class="social-stat">
        <div class="label">Followers</div>
        <div class="value">${has && data.followers ? escapeHtml(data.followers) : "—"}</div>
        ${has && data.updated ? `<div class="updated">(${escapeHtml(data.updated)})</div>` : ""}
      </div>
    </div>
  `;
}

function renderResult(rec){
  const profileHtml = rec.profile && rec.profile !== "-" && rec.profile !== ""
    ? (rec.profile.startsWith("http") ? `<a href="${escapeHtml(rec.profile)}" target="_blank" rel="noopener">${escapeHtml(rec.profile)}</a>` : escapeHtml(rec.profile))
    : "Not available";

  const journalistsHtml = rec.journalists.length
    ? rec.journalists.map(j => `
      <div class="journalist">
        <div class="jname">${escapeHtml(j.name)}</div>
        <div class="jfield"><div class="label">Email</div><div class="val">${j.email ? `<a href="mailto:${escapeHtml(j.email)}">${escapeHtml(j.email)}</a>` : "—"}</div></div>
        <div class="jfield"><div class="label">Phone</div><div class="val">${j.phone ? `<a href="https://wa.me/${escapeHtml(j.phone.replace(/\D/g,''))}" target="_blank" rel="noopener">${escapeHtml(j.phone)}</a>` : "—"}</div></div>
        <div class="jfield"><div class="label">Desk</div><div class="val">${escapeHtml(j.desk) || "—"}</div></div>
      </div>
    `).join("")
    : `<p style="color:var(--muted-solid); font-size:0.9rem;">No journalist details on file.</p>`;

  const html = `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="no">Entry #${escapeHtml(rec.no)}</div>
          <h2>${escapeHtml(rec.media)}</h2>
        </div>
        <div class="badge-row">
          ${rec.tier ? `<span class="badge tier">${escapeHtml(rec.tier)}</span>` : ""}
        </div>
      </div>

      <div class="section">
        <h3>Readership</h3>
        <div class="stat-grid">
          <div class="stat">
            <div class="label">Daily Pageviews (Hypestat.com)</div>
            <div class="value">${rec.readership ? escapeHtml(rec.readership) : "—"}</div>
            ${rec.readershipUpdated ? `<div class="updated">(${escapeHtml(rec.readershipUpdated)})</div>` : ""}
          </div>
        </div>
        <div class="subhead">Profile</div>
        <div class="profile-box ${rec.profile && rec.profile !== "-" ? "" : "empty"}">${profileHtml}</div>
      </div>

      <div class="section">
        <h3>Social Media Handles</h3>
        <div class="social-rows">
          ${Object.keys(SOCIAL_ICONS).map(key => socialCardHTML(key, rec.social[key])).join("")}
        </div>
      </div>

      <div class="section">
        <h3>Journalist Details</h3>
        <div class="journalist-list">${journalistsHtml}</div>
      </div>
    </div>
  `;
  swapResults(html);
}

searchInput.addEventListener('input', () => renderSuggestions(searchInput.value.trim()));
searchInput.addEventListener('keydown', (e) => {
  const items = [...suggestionsEl.querySelectorAll('.suggestion-item[data-media]')];
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    activeIndex = Math.min(activeIndex+1, items.length-1);
    items.forEach((it,i)=>it.classList.toggle('active', i===activeIndex));
    if(items[activeIndex]) items[activeIndex].scrollIntoView({block:'nearest'});
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    activeIndex = Math.max(activeIndex-1, 0);
    items.forEach((it,i)=>it.classList.toggle('active', i===activeIndex));
  } else if(e.key === 'Enter'){
    if(activeIndex >= 0 && items[activeIndex]){
      const media = items[activeIndex].getAttribute('data-media');
      searchInput.value = media;
      doSearch(media);
    } else {
      doSearch();
    }
    suggestionsEl.classList.remove('open');
  } else if(e.key === 'Escape'){
    suggestionsEl.classList.remove('open');
  }
});
searchBtn.addEventListener('click', () => doSearch());
document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-wrap')) suggestionsEl.classList.remove('open');
});
refreshBtn.addEventListener('click', () => loadData());

loadData();
</script>
</body>
</html>
